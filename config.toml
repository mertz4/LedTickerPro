# LED Ticker configuration (non-secret). Secrets (cookies, API keys) go in secrets.env.

[general]
timezone = "America/Chicago"
cache_file = "data/cache.json"

# While true, everyone except superusers (LEDTICKER_SUPERUSERS) sees a "Website under construction" page and the
# API turns them away. Set to false (then restart: sudo systemctl restart ledticker) to let partners/roommates in.
[site]
under_construction = true

# Physical display: identical modules in a grid. Every layout is computed from these numbers.
# Ordered panels (LED Display Supply P2, 256x128 mm) are listed as 128x64 pixels each -> 256x128 total.
[display]
module_width = 128
module_height = 64
modules_across = 2
modules_down = 2

# The real LED panels (Pi only). FM6373 S-PWM panels need the kingdo9/rpi-rgb-led-matrix_pwm_experiment fork,
# which deploy/setup-pi.sh builds into the venv. Bring-up: run its demo on one panel, then
#   sudo systemctl stop ledticker && sudo .venv/bin/python -m ledticker matrix-test
# and once the test pattern looks right, set enabled = true and restart the service.
# Any other RGBMatrixOptions attribute can be added here too (e.g. spwm_scan_rows, spwm_data_layout).
[matrix]
enabled = false
hardware_mapping = "regular"       # Adafruit Triple Bonnet
chain_length = 2                   # two panels per output...
parallel = 2                       # ...on two outputs, top pair and bottom pair
panel_type = "fm6373"
spwm_row_address_type = 0          # DP32019B direct row select
gpio_slowdown = 5                  # fork's spwm.md: 5 for a Pi 4. Lower = faster refresh, until it glitches
pwm_bits = 11
limit_refresh_rate_hz = 0          # 0 = no limit; try 60 if the picture flickers or tears
led_rgb_sequence = "RGB"           # change (e.g. "RBG") if red shows as blue etc. in the test pattern

# Fork tuning variables (spwm.md). Lower SPWM_END_OF_FRAME_EXTRA_ROW_CYCLES = faster, higher = cleaner image.
[matrix.env]
# SPWM_END_OF_FRAME_EXTRA_ROW_CYCLES = 3
# SPWM_FRAME_END_SLEEP_US = 300

[render]
fps = 30
ticker_speed = 36          # pixels per second
# Bottom ticker contents, in order. Options: "games" (every live game the [scores.*] filters track, my teams
# first), "weather", "stocks", "crypto", "news", "trades" (fantasy trades from the last 24 h).
ticker = ["games", "weather", "stocks", "crypto"]
# How one slide turns into the next: "auto" cycles through the styles, "none" cuts, or name one style:
# push_left, push_up, dissolve, split, wipe, melt, iris, blinds, flash. Takeovers always flash in.
transition = "auto"
transition_seconds = 0.6
glint = true               # numbers that just updated (a score, a price) flash white and settle
# What rotates on screen (modes, 4-up layouts, weekly schedule) lives in data/modes.json and is edited
# from the preview page ("Saved modes"). Delete that file to get the built-in defaults back.

[props]
enabled = true
max_games = 2              # games tracked at once (the ones that matter right now)
max_props = 40
live_interval = 90         # seconds between refreshes while a tracked game is live

[location]
name = "College Station, TX"
lat = 30.628
lon = -96.3344

[nws]
# NWS requires a User-Agent that identifies the app and a contact (email or website).
user_agent = "LedTicker/0.1 (personal LED display; contact: set-me)"

# ---- Sports (ESPN public site API) ---------------------------------------------
# filter = "all"  -> whole slate
# filter = "big"  -> my teams + the most important games (ranked matchups, SEC, CFP/bowls, late close games)
# filter = "mine" -> only my teams' games
[scores.nfl]
enabled = true
teams = ["34"]          # Houston Texans
filter = "all"
rivals = ["6"]          # Dallas Cowboys: any score plays the stinker animation (big-play takeover)

[scores.cfb]
enabled = true
teams = ["245"]         # Texas A&M
filter = "big"
max_big = 8

[scores.nba]
enabled = true
teams = ["10"]          # Houston Rockets
filter = "mine"         # only Rockets games (+ next game on off days)

[scores.ncaab]
enabled = true
teams = ["245"]         # Texas A&M men's basketball
filter = "mine"         # only A&M games (+ next game on off days)

# season_start / season_end ("MM-DD"): outside this window the source makes no requests at all.
[scores.mlb]
enabled = true
teams = ["18"]          # Houston Astros
filter = "all"
season_start = "04-15"
season_end = "11-10"    # through the World Series

[scores.cbase]
enabled = true
teams = ["123"]         # Texas A&M baseball (ESPN uses a different ID for college baseball)
filter = "big"
max_big = 6
season_start = "03-01"
season_end = "06-30"    # through the College World Series

# ---- Fantasy (ESPN) -----------------------------------------------------------
# ESPN_LEAGUE_ID, ESPN_S2, ESPN_SWID live in secrets.env.
[fantasy]
enabled = true
season = 2026
my_team_id = "auto"     # "auto" = find my team by matching SWID to team owners
trade_poll_seconds = 30 # how often to check the league feed for new trades (breaking-news takeover; min 10)
# Owners (first + last name as on ESPN) whose players' big plays get the stinker animation instead of fireworks
rivals = ["Michael Frain", "Riley Fuller"]

# ---- Markets ------------------------------------------------------------------
[markets]
stocks = ["SPY", "BRK.B", "VGT", "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "TSLA"]  # FINNHUB_API_KEY
crypto = ["bitcoin", "ethereum"]   # CoinGecko ids; COINGECKO_API_KEY optional

# ---- News ---------------------------------------------------------------------
[news]
max_items = 20
feeds = [
    { name = "ESPN", url = "https://www.espn.com/espn/rss/news" },
    { name = "ESPN NFL", url = "https://www.espn.com/espn/rss/nfl/news" },
    { name = "NPR", url = "https://feeds.npr.org/1001/rss.xml" },
]

# ---- Apple Music via Last.fm (FUTURE POSSIBILITY, off for now) -----------------
# To enable: Last.fm account + iPhone scrobbler app + LASTFM_API_KEY in secrets.env.
[music]
enabled = false
lastfm_user = ""

# ---- AirPlay screen mirroring (Pi only) ------------------------------------------
# An iPhone on the same Wi-Fi picks this display under Screen Mirroring and its screen takes over the panels.
# After changing enabled, run deploy/setup-pi.sh again (it installs the receiver, UxPlay, only when this is on).
[airplay]
enabled = false
name = "LED Ticker"      # what shows up in the iPhone's Screen Mirroring list
fit = "fill"             # "fill": crop the phone's picture to cover the panels. "fit": show all of it, with bars
rotate = ""              # "", "left", "right" or "flip" (e.g. "left" to fill the panels from a phone held upright)
size = "800x400"         # picture size asked of the phone. Smaller = less work and memory for the Pi
fps = 30
decoder = "auto"         # "auto", "hardware" (the Pi's video chip) or "software"
idle_seconds = 30        # the rotation comes back this long after the last new frame (Next on the dashboard: at once)
max_ram_mb = 300         # the receiver is restarted if it ever uses more memory than this (0 = no cap)
extra_args = []          # more UxPlay options, e.g. ["-pin"] to make phones enter a code first

# ---- Eat-out counter (roommates tap +1 on the dashboard each time he gets fast food) ----------
[eatout]
name = "Anthony"
alert = true      # play the full-display "ORDER UP!" takeover on each +1
seconds = 12      # how long it takes over the display

# ---- Love tap (sent from the dashboard by anyone with the love_tap permission) ------
[love]
default_message = "bab misses you"    # shown when the sender leaves the message blank
style = "burst"                       # default animation: flourish, burst, rain or heartbeat
seconds = 20                          # how long it takes over the display

# LED Ticker configuration (non-secret). Secrets (cookies, API keys) go in secrets.env.

[general]
timezone = "America/Chicago"
cache_file = "data/cache.json"

# Physical display: identical modules in a grid. Every layout is computed from these numbers.
# Ordered panels (LED Display Supply P2, 256x128 mm) are listed as 128x64 pixels each -> 256x128 total.
[display]
module_width = 128
module_height = 64
modules_across = 2
modules_down = 2

[render]
fps = 30
ticker_speed = 36          # pixels per second
# Bottom ticker contents, in order. Options: "games" (every live game the [scores.*] filters track, my teams
# first), "weather", "stocks", "crypto", "news", "trades" (fantasy trades from the last 24 h).
ticker = ["games", "weather", "stocks", "crypto"]
# What rotates on screen (modes, 4-up layouts, weekly schedule) lives in data/modes.json and is edited
# from the preview page ("Saved modes"). Delete that file to get the built-in defaults back.

[props]
enabled = true
max_games = 2              # games tracked at once (the ones that matter right now)
max_props = 40
live_interval = 90         # seconds between refreshes while a tracked game is live

[location]
name = "College Station, TX"
lat = 30.628
lon = -96.3344

[nws]
# NWS requires a User-Agent that identifies the app and a contact (email or website).
user_agent = "LedTicker/0.1 (personal LED display; contact: set-me)"

# ---- Sports (ESPN public site API) ---------------------------------------------
# filter = "all"  -> whole slate
# filter = "big"  -> my teams + the most important games (ranked matchups, SEC, CFP/bowls, late close games)
# filter = "mine" -> only my teams' games
[scores.nfl]
enabled = true
teams = ["34"]          # Houston Texans
filter = "all"

[scores.cfb]
enabled = true
teams = ["245"]         # Texas A&M
filter = "big"
max_big = 8

[scores.nba]
enabled = true
teams = ["10"]          # Houston Rockets
filter = "mine"         # only Rockets games (+ next game on off days)

[scores.ncaab]
enabled = true
teams = ["245"]         # Texas A&M men's basketball
filter = "mine"         # only A&M games (+ next game on off days)

# season_start / season_end ("MM-DD"): outside this window the source makes no requests at all.
[scores.mlb]
enabled = true
teams = ["18"]          # Houston Astros
filter = "all"
season_start = "04-15"
season_end = "11-10"    # through the World Series

[scores.cbase]
enabled = true
teams = ["123"]         # Texas A&M baseball (ESPN uses a different ID for college baseball)
filter = "big"
max_big = 6
season_start = "03-01"
season_end = "06-30"    # through the College World Series

# ---- Fantasy (ESPN) -----------------------------------------------------------
# ESPN_LEAGUE_ID, ESPN_S2, ESPN_SWID live in secrets.env.
[fantasy]
enabled = true
season = 2026
my_team_id = "auto"     # "auto" = find my team by matching SWID to team owners
trade_poll_seconds = 30 # how often to check the league feed for new trades (breaking-news takeover; min 10)

# ---- Markets ------------------------------------------------------------------
[markets]
stocks = ["SPY", "BRK.B", "VGT", "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "TSLA"]  # FINNHUB_API_KEY
crypto = ["bitcoin", "ethereum"]   # CoinGecko ids; COINGECKO_API_KEY optional

# ---- News ---------------------------------------------------------------------
[news]
max_items = 20
feeds = [
    { name = "ESPN", url = "https://www.espn.com/espn/rss/news" },
    { name = "ESPN NFL", url = "https://www.espn.com/espn/rss/nfl/news" },
    { name = "NPR", url = "https://feeds.npr.org/1001/rss.xml" },
]

# ---- Apple Music via Last.fm (FUTURE POSSIBILITY, off for now) -----------------
# To enable: Last.fm account + iPhone scrobbler app + LASTFM_API_KEY in secrets.env.
[music]
enabled = false
lastfm_user = ""

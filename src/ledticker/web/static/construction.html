<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Under Construction</title>
<style>
  :root {
    --bg: #0b0c10; --card: #12141a; --line: #262a35; --text: #e7e9ee; --muted: #8a90a0;
    --amber: #ffa81c; --amber-dim: #5a3b0a; --steel: #3a4150; --steel-hi: #566072;
    --red: #ff2a24; --green: #32ff6e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); }
  body {
    color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: minmax(0, 440px); justify-content: center; align-content: center;
    min-height: 100vh; padding: 16px;
  }
  main { min-width: 0; text-align: center; }
  .scene {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 12px 0; overflow: hidden;
  }
  svg { display: block; width: 100%; height: auto; }
  h1 { font-size: 24px; line-height: 1.2; margin: 22px 0 6px; letter-spacing: .01em; }
  p { color: var(--muted); margin: 0 0 18px; }

  /* LED ticker strip */
  .ticker {
    margin: 0 -12px; border-top: 1px solid var(--line); background: #07080b;
    overflow: hidden; white-space: nowrap; padding: 7px 0;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  }
  .ticker span {
    display: inline-block; padding-left: 100%;
    font: 700 15px/1 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; letter-spacing: .18em;
    color: var(--amber); text-shadow: 0 0 6px rgba(255,168,28,.75), 0 0 14px rgba(255,168,28,.35);
    animation: scroll 14s linear infinite;
    animation-delay: -6s;                    /* start mid-scroll so text shows on load */
  }
  @keyframes scroll { to { transform: translateX(-100%); } }

  /* crane: the load swings from the jib tip */
  .swing { transform-origin: 236px 40px; animation: swing 3.2s ease-in-out infinite alternate; }
  @keyframes swing { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  .trolley { animation: trolley 6.4s ease-in-out infinite alternate; }
  @keyframes trolley { from { transform: translateX(-26px); } to { transform: translateX(0); } }

  .beacon { animation: blink 1s steps(1) infinite; }
  .beacon-glow { animation: glow 1s steps(1) infinite; }
  @keyframes blink { 50% { fill: var(--amber-dim); } }
  @keyframes glow { 50% { opacity: 0; } }

  .led { animation: twinkle 1.6s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .25; } }

  .stripes { animation: march 1.2s linear infinite; }
  @keyframes march { to { transform: translateX(-20px); } }

  .hammer { transform-origin: 92px 158px; animation: hammer .7s ease-in-out infinite; }
  @keyframes hammer { 0%, 100% { transform: rotate(-38deg); } 45% { transform: rotate(18deg); } }
  .spark { opacity: 0; animation: spark .7s ease-out infinite; }
  @keyframes spark { 40% { opacity: 0; } 48% { opacity: 1; } 75% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .ticker span { padding-left: 0; }
  }
</style>
</head>
<body>
<main>
  <div class="scene" role="img" aria-label="A little crane lowering an LED panel onto a construction site, with a worker hammering">
    <svg viewBox="0 0 320 200" aria-hidden="true">
      <defs>
        <pattern id="hazard" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">
          <rect width="10" height="20" fill="#ffa81c"/><rect x="10" width="10" height="20" fill="#16181f"/>
        </pattern>
        <pattern id="lattice" width="10" height="10" patternUnits="userSpaceOnUse">
          <path d="M0 10 L10 0 M0 0 L10 10" stroke="#566072" stroke-width="1.2"/>
        </pattern>
        <radialGradient id="beam" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#ffa81c" stop-opacity=".55"/><stop offset="1" stop-color="#ffa81c" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- ground -->
      <rect x="0" y="178" width="320" height="22" fill="#171a22"/>
      <line x1="0" y1="178" x2="320" y2="178" stroke="#262a35" stroke-width="2"/>

      <!-- crane tower + jib -->
      <rect x="44" y="34" width="16" height="144" fill="url(#lattice)" stroke="#566072" stroke-width="2"/>
      <rect x="30" y="170" width="44" height="8" rx="2" fill="#3a4150"/>
      <rect x="20" y="30" width="250" height="10" fill="url(#lattice)" stroke="#566072" stroke-width="2"/>
      <rect x="4" y="40" width="22" height="16" rx="2" fill="#3a4150"/>                 <!-- counterweight -->
      <path d="M52 34 L52 14 M52 14 L262 30 M52 14 L10 30" stroke="#566072" stroke-width="1.5" fill="none"/>
      <rect x="40" y="40" width="24" height="14" rx="2" fill="#2a303c" stroke="#566072"/> <!-- cab -->
      <rect x="44" y="43" width="16" height="7" rx="1" fill="#ffa81c" opacity=".35"/>

      <!-- beacon on the mast -->
      <circle class="beacon-glow" cx="52" cy="11" r="11" fill="url(#beam)"/>
      <circle class="beacon" cx="52" cy="11" r="3.5" fill="#ffa81c"/>

      <!-- trolley + swinging load: a little LED panel -->
      <g class="trolley">
        <rect x="228" y="40" width="16" height="6" rx="1" fill="#3a4150"/>
        <g class="swing">
          <line x1="236" y1="46" x2="236" y2="104" stroke="#8a90a0" stroke-width="1.5"/>
          <path d="M232 104 h8 l-4 6 z" fill="#8a90a0"/>
          <path d="M236 110 L214 120 M236 110 L258 120" stroke="#8a90a0" stroke-width="1.2"/>
          <rect x="208" y="120" width="56" height="30" rx="2" fill="#07080b" stroke="#3a4150" stroke-width="2"/>
          <g fill="#ffa81c">
            <circle class="led" cx="216" cy="128" r="2"/><circle class="led" cx="224" cy="128" r="2" style="animation-delay:.2s"/>
            <circle class="led" cx="232" cy="128" r="2" style="animation-delay:.4s"/><circle class="led" cx="240" cy="128" r="2" style="animation-delay:.6s"/>
            <circle class="led" cx="248" cy="128" r="2" style="animation-delay:.8s"/><circle class="led" cx="256" cy="128" r="2" style="animation-delay:1s"/>
          </g>
          <g fill="#ff2a24">
            <circle class="led" cx="216" cy="135" r="2" style="animation-delay:.5s"/><circle class="led" cx="232" cy="135" r="2" style="animation-delay:.9s"/>
            <circle class="led" cx="248" cy="135" r="2" style="animation-delay:.1s"/>
          </g>
          <g fill="#32ff6e">
            <circle class="led" cx="224" cy="142" r="2" style="animation-delay:.3s"/><circle class="led" cx="240" cy="142" r="2" style="animation-delay:.7s"/>
            <circle class="led" cx="256" cy="142" r="2" style="animation-delay:1.1s"/>
          </g>
        </g>
      </g>

      <!-- worker hammering -->
      <g>
        <circle cx="110" cy="136" r="7" fill="#e0b48a"/>
        <path d="M102 133 a8 8 0 0 1 16 0 z" fill="#ffa81c"/>               <!-- hard hat -->
        <rect x="100" y="132" width="20" height="2.5" rx="1" fill="#ffa81c"/>
        <rect x="103" y="144" width="14" height="20" rx="3" fill="#ff7a1a"/>  <!-- vest -->
        <rect x="103" y="151" width="14" height="2" fill="#e7e9ee" opacity=".8"/>
        <rect x="104" y="164" width="5" height="14" fill="#3a4150"/><rect x="111" y="164" width="5" height="14" fill="#3a4150"/>
        <g class="hammer">
          <line x1="104" y1="150" x2="92" y2="158" stroke="#e0b48a" stroke-width="4" stroke-linecap="round"/>
          <line x1="92" y1="158" x2="80" y2="150" stroke="#8a6a44" stroke-width="3" stroke-linecap="round"/>
          <rect x="74" y="144" width="10" height="7" rx="1" fill="#8a90a0" transform="rotate(-34 79 147)"/>
        </g>
        <rect x="64" y="166" width="30" height="12" rx="1" fill="#6b4a2b"/>  <!-- plank -->
        <g class="spark" stroke="#ffa81c" stroke-width="1.5" stroke-linecap="round">
          <path d="M70 162 l-5 -4 M74 160 l0 -6 M78 162 l5 -4"/>
        </g>
      </g>

      <!-- cone -->
      <path d="M156 178 L166 146 L176 178 z" fill="#ff7a1a"/>
      <rect x="160.5" y="160" width="11" height="4" fill="#e7e9ee"/>
      <rect x="152" y="176" width="28" height="3" rx="1" fill="#ff7a1a"/>

      <!-- barrier with marching stripes -->
      <rect x="196" y="164" width="4" height="14" fill="#3a4150"/><rect x="300" y="164" width="4" height="14" fill="#3a4150"/>
      <svg x="192" y="156" width="116" height="10" viewBox="0 0 116 10" overflow="hidden">
        <rect class="stripes" x="0" y="0" width="140" height="10" fill="url(#hazard)"/>
      </svg>
      <rect x="192" y="156" width="116" height="10" fill="none" stroke="#16181f" stroke-width="1"/>
    </svg>
    <div class="ticker" aria-hidden="true"><span>UNDER CONSTRUCTION &nbsp;&bull;&nbsp; CHECK BACK SOON &nbsp;&bull;&nbsp; UNDER CONSTRUCTION &nbsp;&bull;&nbsp; CHECK BACK SOON &nbsp;&bull;&nbsp;</span></div>
  </div>
  <h1>Website under construction</h1>
  <p>We're still building this. Check back soon.</p>
</main>
</body>
</html>
